<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Sheet Builder</title>
<!-- Inter @font-face lives in fonts/inter-face.css (owned by the fonts item).
     If that file is absent the page still works; the UI chrome falls back to system-ui. -->
<link rel="stylesheet" href="fonts/inter-face.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- LEFT: preview area (flexible, scrolls independently) -->
  <main class="preview-col" id="preview-col">
    <div class="preview-col-inner">
      <div id="preview-root"></div>
      <div id="page-nav"></div>
    </div>
  </main>

  <!-- RIGHT: side input panel (sticky ~360px).
       Two tab pages. Every child below is an empty mount point owned by another
       module; the ids are the contract, the ORDER here is what the user sees.
       #override-panel and #sheet-panel are declared explicitly (rather than being
       appended by js/overrides.js) precisely so that order is set here and the
       sheet-wide settings can live on their own page. -->
  <aside class="side-panel" id="side-panel">
    <header class="side-panel-head">
      <h1>Badge Sheet Builder</h1>
      <p class="side-panel-sub">6 per sheet &middot; 4&#8243; &times; 3&#8243;</p>
    </header>

    <div class="panel-tabs" role="tablist" aria-label="Panel pages">
      <button type="button" class="panel-tab" id="tab-badges" role="tab"
              aria-selected="true" aria-controls="page-badges">Badges</button>
      <button type="button" class="panel-tab" id="tab-sheet" role="tab"
              aria-selected="false" aria-controls="page-sheet" tabindex="-1">Sheet settings</button>
    </div>

    <!-- PAGE 1: everything to do with who is on the sheet -->
    <div class="panel-page" id="page-badges" role="tabpanel" aria-labelledby="tab-badges">
      <div id="data-controls"></div>
      <div id="entry-form"></div>
      <div id="csv-import"></div>
      <div id="bulk-paste"></div>
      <div id="attendee-list"></div>
      <div id="override-panel"></div>
    </div>

    <!-- PAGE 2: settings that apply to every badge on every sheet -->
    <div class="panel-page" id="page-sheet" role="tabpanel" aria-labelledby="tab-sheet" hidden>
      <div id="sheet-panel"></div>
    </div>
  </aside>

</div>

<!-- Classic scripts only, loaded in dependency order. Some of these files are owned by
     other work items and may not exist yet; a 404 on a classic script is non-fatal, the
     bootstrap in app.js guards every module call. -->
<script src="fonts/inter-metrics.js"></script>
<script src="fonts/inter-fontdata.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/pdf-lib-fontkit.min.js"></script>
<script src="js/dom.js"></script>
<script src="js/spec.js"></script>
<script src="js/layout.js"></script>
<script src="js/store.js"></script>
<script src="js/pdf.js"></script>
<script src="js/zip.js"></script>
<script src="js/docx.js"></script>
<script src="js/input.js"></script>
<script src="js/preview.js"></script>
<script src="js/sheet-settings.js"></script>
<script src="js/overrides.js"></script>
<script src="app.js"></script>

</body>
</html>
